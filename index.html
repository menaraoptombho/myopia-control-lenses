<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8UcaieurN6CP7hYle6UQuUUVAuVScZ_ExDvbwpm70PCTwTd9-sYZP06CbxWgHf-vRCxnU3Caj6PXx/pub?output=csv';

    function fetchLensData() {
        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                const lenses = results.data;
                const container = document.getElementById('lens-grid');

                if (!lenses || lenses.length === 0) {
                    document.getElementById('loading').innerText = 'Tiada data dijumpai.';
                    document.getElementById('loading').style.display = 'block';
                    return;
                }

                lenses.forEach(lens => {
                    // Mencarikan tajuk lajur pertama secara fleksibel (abaikan huruf besar/kecil & jarak)
                    const keys = Object.keys(lens);
                    const brandKey = keys.find(k => k.toLowerCase().replace(/\s+/g, '').includes('brand')) || keys[0];
                    const brandLensName = lens[brandKey];

                    if (!brandLensName || brandLensName.trim() === '') return; 

                    // Cari URL Gambar fleksibel
                    const imgKey = keys.find(k => k.toLowerCase().includes('image')) || 'Image URL';
                    const imgUrl = (lens[imgKey] && lens[imgKey].trim() !== '') 
                        ? lens[imgKey] 
                        : 'https://via.placeholder.com/400x250?text=Tiada+Gambar';

                    // Cari key yang lain
                    const designKey = keys.find(k => k.toLowerCase().includes('design')) || 'design type';
                    const techKey = keys.find(k => k.toLowerCase().includes('tech')) || 'technology';
                    const indexKey = keys.find(k => k.toLowerCase().includes('index')) || 'index';
                    const optKey = keys.find(k => k.toLowerCase().includes('opt')) || 'option';
                    const notesKey = keys.find(k => k.toLowerCase().includes('note')) || 'notes';
                    const rxKey = keys.find(k => k.toLowerCase().includes('rx')) || 'Rx';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${imgUrl}" class="card-img" alt="${brandLensName}" onerror="this.src='https://via.placeholder.com/400x250?text=Gambar+Ralat'">
                        <div class="card-content">
                            <div class="badge-group">
                                ${lens[designKey] ? `<span class="badge">${lens[designKey]}</span>` : ''}
                                ${lens[indexKey] ? `<span class="badge badge-index">Index: ${lens[indexKey]}</span>` : ''}
                            </div>
                            
                            <h3>${brandLensName}</h3>
                            
                            <div class="spec-list">
                                ${lens[techKey] ? `<div class="spec-item"><span class="spec-label">Teknologi:</span> ${lens[techKey]}</div>` : ''}
                                ${lens[optKey] ? `<div class="spec-item"><span class="spec-label">Pilihan (Option):</span> ${lens[optKey]}</div>` : ''}
                                ${lens[rxKey] ? `<div class="spec-item"><span class="spec-label">Preskripsi (Rx):</span> ${lens[rxKey]}</div>` : ''}
                            </div>

                            ${lens[notesKey] ? `<div class="notes-box"><strong>Nota:</strong> ${lens[notesKey]}</div>` : ''}
                        </div>
                    `;
                    container.appendChild(card);
                });
            },
            error: function(err) {
                document.getElementById('loading').innerText = 'Gagal memuatkan data.';
            }
        });
    }

    window.onload = fetchLensData;
</script>
